<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3rdUp – Genuine Impact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,700;0,800;0,900&family=Barlow+Condensed:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAV -->
<nav>
  <a href="#" class="logo">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" style="margin-right:6px">
      <rect width="20" height="20" rx="5" fill="white" fill-opacity="0.25"/>
      <text x="4" y="14" font-family="Barlow" font-weight="900" font-size="11" fill="white">3</text>
    </svg>
    3rd up
  </a>
  <ul class="nav-links">
    <li><a href="#">Features</a></li>
    <li><a href="#">Solutions</a></li>
    <li><a href="#">Pricing</a></li>
    <li><a href="#">Contact us</a></li>
  </ul>
  <div class="nav-actions">
    <button class="btn-ghost">Login</button>
    <button class="btn-solid">Start Now</button>
  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <div class="hero-left">
    <h1 class="hero-title">Genuine.<br>Impact.</h1>
    <p class="hero-desc">
      3rdUp connects seamlessly with the platforms you already use. From
      ad networks like Adform, Google DV360, and Xandr, to app
      integrations with Yinzcam, and embedding across any CMS.
    </p>
    <a href="#" class="btn-cta">
      Get Started <span class="arrow">→</span>
    </a>
  </div>

  <div class="hero-right">
    <div class="slider-scene">
      <div class="slider-fade-left"></div>
      <div class="slider-fade-right"></div>

      <div class="card-track" id="cardTrack">

        <!-- Card 0 -->
        <div class="card" data-pos="0" data-index="0" onclick="rotateTo(0)">
          <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&h=600&fit=crop" alt="Product 1">
          <div class="card-overlay"><button class="card-buy-btn">Purchase Now</button></div>
        </div>

        <!-- Card 1 -->
        <div class="card" data-pos="1" data-index="1" onclick="rotateTo(1)">
          <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400&h=600&fit=crop" alt="Product 2">
          <div class="card-overlay"><button class="card-buy-btn">Purchase Now</button></div>
        </div>

        <!-- Card 2 – active center -->
        <div class="card active" data-pos="2" data-index="2" onclick="rotateTo(2)">
          <img src="https://images.unsplash.com/photo-1596462502278-27bfdc403348?w=400&h=600&fit=crop" alt="Product 3">
          <div class="card-overlay"><button class="card-buy-btn">Purchase Now</button></div>
        </div>

        <!-- Card 3 -->
        <div class="card" data-pos="3" data-index="3" onclick="rotateTo(3)">
          <img src="https://images.unsplash.com/photo-1491553895911-0055eca6402d?w=400&h=600&fit=crop" alt="Product 4">
          <div class="card-overlay"><button class="card-buy-btn">Purchase Now</button></div>
        </div>

        <!-- Card 4 -->
        <div class="card" data-pos="4" data-index="4" onclick="rotateTo(4)">
          <img src="https://images.unsplash.com/photo-1581803118522-7b72a50f7e9f?w=400&h=600&fit=crop" alt="Product 5">
          <div class="card-overlay"><button class="card-buy-btn">Purchase Now</button></div>
        </div>
      </div>

      <!-- Dots -->
      <div class="slider-dots" id="dots">
        <button class="dot" onclick="rotateTo(0)"></button>
        <button class="dot" onclick="rotateTo(1)"></button>
        <button class="dot active" onclick="rotateTo(2)"></button>
        <button class="dot" onclick="rotateTo(3)"></button>
        <button class="dot active-target" onclick="rotateTo(4)"></button>
      </div>
    </div>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
